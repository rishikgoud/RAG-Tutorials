[project]
name = "rag-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rishikgoud11", email = "trishikgoud@supervity.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-openai>=1.7.3",
]

[project.scripts]
rag-tutorial = "rag_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
